<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Stock Eyecryl Phakic Toric Barcelona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* One visual world: a WhatsApp chat. Polls per model on "Disponibles", received messages on "Reservadas". */
  --chat: #efeae2;
  --bubble: #ffffff;
  --mine: #d9fdd3;
  --green: #008069;
  --green-2: #25d366;
  --ink: #111b21;
  --muted: #667781;
  --line: #e9edef;
  --warn: #b25e09;
  --font: "Figtree", "Segoe UI", Helvetica, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--chat);
  background-image: radial-gradient(rgba(0,0,0,.035) 1px, transparent 1.2px);
  background-size: 18px 18px;
  font-family: var(--font); color: var(--ink); font-size: 15px;
  -webkit-font-smoothing: antialiased;
}
header { position: sticky; top: 0; z-index: 10; background: var(--green); color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.hrow { display: flex; align-items: center; gap: 12px; padding: 12px 16px 8px; }
.avatar { width: 42px; height: 42px; border-radius: 50%; background: #fff; color: var(--green); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.htitle { font-weight: 700; font-size: 17px; line-height: 1.2; }
.hsub { font-size: 13px; opacity: .88; }
nav { display: flex; }
nav a { flex: 1; text-align: center; color: rgba(255,255,255,.75); text-decoration: none; font-weight: 700; font-size: 14px; letter-spacing: .02em;
  padding: 10px 6px 11px; border-bottom: 3px solid transparent; text-transform: uppercase; }
nav a[aria-current="page"] { color: #fff; border-bottom-color: #fff; }
nav .count { display: inline-block; min-width: 22px; padding: 1px 7px; margin-left: 6px; border-radius: 11px; background: rgba(255,255,255,.22); font-size: 12px; }
nav a[aria-current="page"] .count { background: #fff; color: var(--green); }
.tools { display: flex; gap: 8px; padding: 0 16px 12px; flex-wrap: wrap; }
.search { flex: 1 1 170px; display: flex; align-items: center; background: #fff; border-radius: 20px; padding: 0 12px; }
.search input { border: 0; outline: 0; font: inherit; padding: 8px 6px; width: 100%; color: var(--ink); background: transparent; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid rgba(255,255,255,.55); background: transparent; color: #fff; border-radius: 16px; padding: 6px 12px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: #fff; color: var(--green); border-color: #fff; }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--green-2); outline-offset: 2px; }

main { max-width: 660px; margin: 0 auto; padding: 14px 12px 110px; display: flex; flex-direction: column; gap: 12px; }
.daypill { align-self: center; background: #fff; color: var(--muted); font-size: 12.5px; padding: 5px 12px; border-radius: 8px; box-shadow: 0 1px .5px rgba(11,20,26,.13); text-align: center; }
.note { align-self: center; background: #ffeecd; color: #54656f; font-size: 13px; padding: 8px 12px; border-radius: 8px; text-align: center; max-width: 94%; }
.bubble { background: var(--mine); border-radius: 10px 0 10px 10px; padding: 10px 10px 6px; position: relative; box-shadow: 0 1px .5px rgba(11,20,26,.13); align-self: flex-end; width: min(100%, 580px); }
.bubble::after { content: ""; position: absolute; right: -8px; top: 0; border-left: 8px solid var(--mine); border-bottom: 10px solid transparent; }
.bubble.in { background: var(--bubble); border-radius: 0 10px 10px 10px; align-self: flex-start; }
.bubble.in::after { right: auto; left: -8px; border-left: 0; border-right: 8px solid var(--bubble); }
.ptitle { font-weight: 700; font-size: 16px; margin: 2px 4px; }
.psub { color: var(--muted); font-size: 13px; margin: 0 4px 8px; display: flex; align-items: center; gap: 6px; }
.opt { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 10px; padding: 9px 4px; border: 0; border-top: 1px solid rgba(0,0,0,.06);
  cursor: pointer; background: none; width: 100%; text-align: left; font: inherit; color: inherit; }
.opt:first-of-type { border-top: 0; }
.radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #8696a0; }
.opt:hover .radio { border-color: var(--green); }
.otext { min-width: 0; }
.opow { font-weight: 600; font-size: 15.5px; font-variant-numeric: tabular-nums; }
.ometa { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; margin-top: 2px; }
.soon { color: var(--warn); font-weight: 600; }
.vf { color: var(--warn); font-weight: 600; font-size: 12.5px; margin-top: 2px; }
.bar { height: 3px; border-radius: 2px; background: rgba(0,128,105,.18); margin-top: 6px; }
.thumb { width: 104px; height: 56px; border-radius: 6px; object-fit: cover; object-position: left center; border: 1px solid rgba(0,0,0,.08); background: #f4f4f4; cursor: zoom-in; }
.pfoot { display: flex; justify-content: space-between; color: var(--muted); font-size: 11.5px; padding: 6px 4px 0; border-top: 1px solid rgba(0,0,0,.06); }
.empty { color: var(--muted); font-size: 14px; padding: 10px 4px; }

.res { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; padding: 4px 2px; }
.res .who { font-weight: 700; color: var(--green); font-size: 14px; }
.res .doc { font-size: 14px; margin-top: 2px; }
.res .thumb { width: 120px; height: 64px; }
.racts { display: flex; gap: 8px; justify-content: flex-end; padding-top: 8px; flex-wrap: wrap; }
.time { color: var(--muted); font-size: 11.5px; text-align: right; padding-top: 4px; }

.btn { border: 0; border-radius: 18px; padding: 9px 15px; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; }
.btn-ghost { background: #e7f5f1; color: var(--green); }
.btn-main { background: var(--green); color: #fff; }
.btn-light { background: #f0f2f5; color: var(--ink); }
.btn.ok { background: #2e7d32; color: #fff; }

.scrim { position: fixed; inset: 0; background: rgba(11,20,26,.45); display: none; z-index: 30; }
.scrim.on { display: block; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: #fff; border-radius: 16px 16px 0 0; max-width: 660px; margin: 0 auto;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); display: none; flex-direction: column; gap: 12px; max-height: 92%; overflow: auto; }
.sheet.on { display: flex; }
.sheet h2 { margin: 0; font-size: 18px; text-wrap: balance; }
.sheet img { width: 100%; border-radius: 10px; border: 1px solid var(--line); }
.spec { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; font-variant-numeric: tabular-nums; margin: 0; }
.spec dt { color: var(--muted); }
.spec dd { margin: 0; font-weight: 600; }
.sheet label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
.sheet input, .sheet select { width: 100%; font: inherit; padding: 11px 12px; border: 1px solid #d1d7db; border-radius: 10px; background: #fff; color: var(--ink); }
.people { display: flex; flex-wrap: wrap; gap: 6px; }
.people button { border: 1px solid #d1d7db; background: #fff; border-radius: 18px; padding: 8px 12px; font: inherit; font-size: 14px; cursor: pointer; color: var(--ink); }
.people button[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }
.err { color: #c62828; font-size: 13px; min-height: 1em; }
.acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.done { display: flex; align-items: center; gap: 10px; }
.done .tick { width: 36px; height: 36px; border-radius: 50%; background: var(--green-2); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 20px; flex: none; }
.mail { background: #f6f8f8; border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; font-variant-numeric: tabular-nums; margin: 0; font-family: inherit; }
.zoom { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.88); display: none; place-items: center; padding: 16px; cursor: zoom-out; }
.zoom.on { display: grid; }
.zoom img { max-width: 100%; max-height: 90%; border-radius: 8px; }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 35; background: #233138; color: #fff; border-radius: 10px;
  padding: 10px 10px 10px 16px; display: none; gap: 14px; align-items: center; font-size: 14px; width: min(92%, 480px); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.toast.on { display: flex; }
.toast button { background: none; border: 0; color: var(--green-2); font: inherit; font-weight: 700; cursor: pointer; padding: 6px 8px; margin-left: auto; }
[hidden] { display: none !important; }
</style>
</head>

<main>

    </div>
  </section>
  <section id="page-res" hidden>
    <div style="display:flex;flex-direction:column;gap:12px">

    </div>
  </section>
</main>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">

  <dl class="spec" id="sh-spec"></dl>
  <div>
    <label id="lbl-who">¿Quién reserva?</label>

  </div>
  <div>
    <label for="sh-doc">¿Para qué doctor?</label>
    <input id="sh-doc" type="text" maxlength="100" autocomplete="off" placeholder="Dr./Dra. y clínica">
  </div>
  <div class="err" id="sh-err"></div>
  <div class="acts">
    <button class="btn btn-light" id="sh-cancel" type="button">Cancelar</button>
    <button class="btn btn-main" id="sh-ok" type="button">Reservar</button>
  </div>
</div>

<div class="sheet" id="done" role="dialog" aria-modal="true" aria-labelledby="dn-title">
  <div class="done"><div class="tick" aria-hidden="true">✓</div><h2 id="dn-title">Lente reservada</h2></div>

  <pre class="mail" id="dn-text"></pre>
  <div class="acts">
    <button class="btn btn-light" id="dn-undo" type="button">Deshacer reserva</button>
    <button class="btn btn-main" id="dn-copy" type="button">Copiar para email</button>
  </div>
  <button class="btn btn-ghost" id="dn-close" type="button">Hecho</button>
</div>

<div class="zoom" id="zoom"><img id="zoom-img" alt="Etiqueta ampliada"></div>
<div class="toast" id="toast" role="status"><span id="toast-text"></span><button id="toast-undo" type="button">Deshacer</button></div>

const MODELS = ["PC130T", "PC135T", "PC140T"];
const API = (CONFIG.API_URL || "").trim();
const KEY = "stock-eyecryl-bcn-reservas";
const state = { res: {}, loaded: false, filter: "", q: "", page: "disponibles", busy: 0 };
const byId = new Map(LENTES.map((l) => [l.id, l]));
let pending = null, lastId = null, toastTimer = null, who = "";
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
who = store.get("stock-eyecryl-quien") || "";

const fmtD = (v) => v == null ? "¿?" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(1).replace(".", ",");
const fmtC = (v) => v == null ? "¿?" : "+" + Number(v).toFixed(2).replace(".", ",");
const fmtE = (v) => v == null ? "¿?" : v + "°";
const num = (v) => v == null ? -999 : v;
const soon = (c) => c && c <= "2027/12";
const when = (t) => t ? new Date(t).toLocaleString("es-ES", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const title = (l) => `${fmtD(l.esfera)} D  ·  Cil ${fmtC(l.cilindro)}  ·  Eje ${fmtE(l.eje)}`;

function mailText(l, r) {
  return [
    "Reserva de lente EYECRYL PHAKIC TORIC",
    `Modelo: ${l.modelo}`,
    `Esfera: ${fmtD(l.esfera)} D | Cilindro: ${fmtC(l.cilindro)} D | Eje: ${fmtE(l.eje)}`,
    `Nº de serie: ${l.sn}` + (l.lote ? ` | Lote: ${l.lote}` : ""),
    `Caducidad: ${l.caducidad || "—"}`,
    `Almacén: ${CONFIG.ALMACEN}`,
    `Doctor: ${r ? r.doctor : "—"}`,
    `Reservada por: ${r ? r.quien : "—"}` + (r && r.at ? ` (${when(r.at)})` : "")
  ].join("\n");
}

function thumb(l) {
  const img = el("img", "thumb"); img.alt = "Caja " + l.modelo + " " + fmtD(l.esfera); img.loading = "lazy"; img.src = l.foto;
  img.addEventListener("click", (e) => { e.stopPropagation(); $("zoom-img").src = l.foto; $("zoom").classList.add("on"); });
  return img;
}

function matches(l) {
  if (state.filter && l.modelo !== state.filter) return false;
  const q = state.q.trim().replace(",", ".").replace("−", "-").toLowerCase();
  if (!q) return true;
  const r = state.res[l.id];
  if (/^\d{4,}$/.test(q)) return String(l.sn).includes(q);
  const n = parseFloat(q);
  if (!isNaN(n) && /^[-+]?\d/.test(q)) return l.esfera != null && Math.abs(Math.abs(l.esfera) - Math.abs(n)) < 0.01;
  return [l.modelo, l.sn, l.lote, r && r.doctor, r && r.quien].join(" ").toLowerCase().includes(q);
}

function render() {
  const avail = LENTES.filter((l) => !state.res[l.id]);
  const reserved = LENTES.filter((l) => state.res[l.id]).sort((a, b) => (state.res[b.id].at || 0) - (state.res[a.id].at || 0));
  $("n-disp").textContent = avail.length; $("n-res").textContent = reserved.length;
  $("hsub").textContent = state.loaded ? `${avail.length} disponibles · ${reserved.length} reservadas` + (API ? "" : " · modo prueba") : "Cargando…";
  const onDisp = state.page === "disponibles";
  $("page-disp").hidden = !onDisp; $("page-res").hidden = onDisp;
  $("nav-disp").setAttribute("aria-current", onDisp ? "page" : "false");
  $("nav-res").setAttribute("aria-current", onDisp ? "false" : "page");

  // Disponibles
  const polls = $("polls"); polls.replaceChildren();
  let shown = 0;
  for (const m of MODELS) {
    if (state.filter && state.filter !== m) continue;
    const all = avail.filter((l) => l.modelo === m);
    const list = all.filter(matches).sort((a, b) => num(b.esfera) - num(a.esfera) || num(a.cilindro) - num(b.cilindro) || String(a.sn).localeCompare(String(b.sn)));
    if (state.q && !list.length) continue;
    const b = el("section", "bubble");
    b.append(el("div", "ptitle", "EYECRYL PHAKIC TORIC · " + m));
    const ps = el("div", "psub");
    ps.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path fill="#667781" d="M3 5h2v14H3zm4 6h2v8H7zm4-4h2v12h-2zm4 6h2v6h-2zm4-9h2v15h-2z"/></svg>';
    ps.append(document.createTextNode("Selecciona una lente"));
    b.append(ps);
    if (!list.length) b.append(el("div", "empty", "No quedan lentes de este modelo."));
    for (const l of list) {
      const o = el("button", "opt"); o.type = "button";
      o.setAttribute("aria-label", `Reservar ${m} ${title(l)}, serie ${l.sn}`);
      o.append(el("span", "radio"));
      const t = el("span", "otext");
      t.append(el("div", "opow", title(l)));
      const meta = el("div", "ometa", `SN ${l.sn} · Cad. `); meta.append(el("span", soon(l.caducidad) ? "soon" : "", l.caducidad || "—"));
      t.append(meta);
      if (l.revisar) t.append(el("div", "vf", "⚠ " + l.revisar));
      t.append(el("div", "bar"));
      o.append(t, thumb(l));
      o.addEventListener("click", () => openSheet(l));
      b.append(o); shown++;
    }
    const f = el("div", "pfoot");
    f.append(el("span", "", `${all.length} disponible${all.length === 1 ? "" : "s"}`), el("span", "", "✓✓"));
    b.append(f); polls.append(b);
  }
  if (state.q && !shown) { const b = el("section", "bubble"); b.append(el("div", "empty", `No hay lentes disponibles con «${state.q}».`)); polls.append(b); }

  // Reservadas
  const rl = $("reslist"); rl.replaceChildren();
  const rlist = reserved.filter(matches);
  if (!rlist.length) { const b = el("section", "bubble in"); b.append(el("div", "empty", reserved.length ? `Ninguna reserva coincide con «${state.q}».` : "Todavía no hay lentes reservadas.")); rl.append(b); }
  for (const l of rlist) {
    const r = state.res[l.id];
    const b = el("section", "bubble in");
    const row = el("div", "res");
    const t = el("div");
    t.append(el("div", "who", r.quien));
    t.append(el("div", "opow", `${l.modelo}  ${title(l)}`));
    t.append(el("div", "doc", "Para: " + r.doctor));
    t.append(el("div", "ometa", `SN ${l.sn}` + (l.lote ? ` · Lote ${l.lote}` : "") + ` · Cad. ${l.caducidad || "—"}`));
    row.append(t, thumb(l)); b.append(row);
    const a = el("div", "racts");
    const cp = el("button", "btn btn-ghost", "Copiar para email"); cp.type = "button";
    cp.addEventListener("click", () => copyText(mailText(l, r), cp));
    const lb = el("button", "btn btn-light", "Liberar"); lb.type = "button";
    lb.addEventListener("click", () => { if (lb.dataset.sure) { release(l.id); } else { lb.dataset.sure = "1"; lb.textContent = "¿Seguro? Toca otra vez"; setTimeout(() => { delete lb.dataset.sure; lb.textContent = "Liberar"; }, 3000); } });
    a.append(lb, cp); b.append(a);
    b.append(el("div", "time", when(r.at)));
    rl.append(b);
  }
}

function openSheet(l) {
  pending = l;
  $("sh-title").textContent = `${l.modelo}  ${title(l)}`;
  $("sh-img").src = l.foto;
  const spec = $("sh-spec"); spec.replaceChildren();
  const rows = [["Modelo", l.modelo], ["Esfera", fmtD(l.esfera) + " D"], ["Cilindro", fmtC(l.cilindro) + " D"], ["Eje", fmtE(l.eje)],
                ["Nº de serie", l.sn], ["Lote", l.lote || "—"], ["Caducidad", l.caducidad || "—"]];
  if (l.revisar) rows.push(["Revisar", l.revisar]);
  for (const [k, v] of rows) { spec.append(el("dt", "", k)); const dd = el("dd", k === "Revisar" ? "vf" : "", v); spec.append(dd); }
  const pp = $("people"); pp.replaceChildren();
  for (const p of CONFIG.PERSONAS) {
    const b = el("button", "", p); b.type = "button"; b.setAttribute("aria-pressed", String(p === who));
    b.addEventListener("click", () => { who = p; pp.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); $("sh-err").textContent = ""; });
    pp.append(b);
  }
  $("sh-doc").value = ""; $("sh-err").textContent = "";
  show("sheet");
  setTimeout(() => $("sh-doc").focus(), 60);
}
function show(id) { $("scrim").classList.add("on"); ["sheet", "done"].forEach((x) => $(x).classList.toggle("on", x === id)); }
function closeAll() { $("scrim").classList.remove("on"); $("sheet").classList.remove("on"); $("done").classList.remove("on"); pending = null; }

async function reserve() {
  if (!pending) return;
  const l = pending, doctor = $("sh-doc").value.trim();
  if (!who) { $("sh-err").textContent = "Elige quién reserva la lente."; return; }
  if (!doctor) { $("sh-err").textContent = "Escribe para qué doctor es."; $("sh-doc").focus(); return; }
  store.set("stock-eyecryl-quien", who);
  const r = { quien: who, doctor, at: Date.now() };
  $("sh-ok").disabled = true;
  const ok = await save("reservar", l.id, r);
  $("sh-ok").disabled = false;
  if (!ok) return;
  lastId = l.id;
  $("dn-text").textContent = mailText(l, state.res[l.id] || r);
  show("done");
}

async function release(id, quiet) {
  const ok = await save("liberar", id);
  if (ok && !quiet) {
    const l = byId.get(id);
    showToast(`${l.modelo} ${fmtD(l.esfera)} vuelve a Disponibles`, null);
  }
  return ok;
}

/* ---------- datos: hoja de Google (compartido) o este navegador (prueba) ---------- */
function readLocal() { try { return JSON.parse(store.get(KEY) || "{}") || {}; } catch (e) { return {}; } }
async function load() {
  if (!API) { state.res = readLocal(); state.loaded = true; showStatus("Modo prueba: las reservas solo se guardan en este navegador. Para compartirlas con el equipo, configura API_URL."); render(); return; }
  if (state.busy) return;
  try {
    const j = await (await fetch(API, { cache: "no-store" })).json();
    if (!j.ok) throw new Error(j.error);
    state.res = j.reservas || {}; state.loaded = true;
    if ($("status").dataset.kind === "net") showStatus("");
    render();
  } catch (e) { showStatus("No se puede conectar con el stock. Revisa la conexión.", "net"); }
}
async function save(action, id, r) {
  const prev = state.res[id];
  if (action === "reservar") state.res[id] = r; else delete state.res[id];
  render();
  if (!API) { store.set(KEY, JSON.stringify(state.res)); return true; }
  state.busy++;
  try {
    const l = byId.get(id);
    const body = action === "reservar" ? { action, id, quien: r.quien, doctor: r.doctor, lente: `${l.modelo} ${title(l)} · SN ${l.sn}` } : { action, id };
    const j = await (await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })).json();
    if (j.reservas) { state.res = j.reservas; render(); }
    if (!j.ok) { showStatus(j.error || "No se ha podido guardar."); return false; }
    return true;
  } catch (e) {
    if (prev) state.res[id] = prev; else delete state.res[id];
    render(); showStatus("No se ha podido guardar. Revisa la conexión y vuelve a intentarlo.", "net"); return false;
  } finally { state.busy--; }
}

async function copyText(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    try { const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.append(ta); ta.select(); ok = document.execCommand("copy"); ta.remove(); } catch (e2) {}
  }
  if (btn) { const o = btn.textContent; btn.textContent = ok ? "¡Copiado!" : "Selecciona el texto y cópialo"; btn.classList.toggle("ok", ok);
    setTimeout(() => { btn.textContent = o; btn.classList.remove("ok"); }, 2200); }
}
function showToast(text) { $("toast-text").textContent = text; $("toast-undo").hidden = true; $("toast").classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $("toast").classList.remove("on"), 4000); }
function showStatus(t, kind) { const s = $("status"); s.textContent = t; s.hidden = !t; s.dataset.kind = kind || ""; }

function route() { state.page = location.hash === "#reservadas" ? "reservadas" : "disponibles"; render(); window.scrollTo(0, 0); }

$("sh-ok").addEventListener("click", reserve);
$("sh-cancel").addEventListener("click", closeAll);
$("scrim").addEventListener("click", closeAll);
$("dn-close").addEventListener("click", closeAll);
$("dn-copy").addEventListener("click", () => copyText($("dn-text").textContent, $("dn-copy")));
$("dn-undo").addEventListener("click", async () => { const id = lastId; closeAll(); if (id) await release(id, true); });
$("zoom").addEventListener("click", () => $("zoom").classList.remove("on"));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeAll(); $("zoom").classList.remove("on"); } });
$("q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
document.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => {
  state.filter = c.dataset.m; document.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", String(x === c))); render();
}));
window.addEventListener("hashchange", route);
document.addEventListener("visibilitychange", () => { if (!document.hidden && API) load(); });
setInterval(() => { if (!document.hidden && API) load(); }, 20000);

state.page = location.hash === "#reservadas" ? "reservadas" : "disponibles";
render();
load();
</script>
</body>
